  <main class="main-content">
    <h2>Excited For New Product In Inventory</h2>

    <form action="" class="product-form" method="POST" enctype="multipart/form-data">


      <div class="form-main-div">
        <div class="product-info">
          <!-- Product Title -->

          <div class="form-group">
            <label for="title">Product Title:</label>
            <input type="text" id="title" name="title" required>
          </div>

          <!-- Brand -->
          <div class="form-group">
            <label for="brand">Brand:</label>
            <input type="text" id="brand" name="brand" required>
          </div>

          <!-- Selling Price -->
          <div class="form-group">
            <label for="selling-price">Selling Price:</label>
            <input type="number" id="selling-price" name="selling-price" required>
          </div>

          <!-- Cost Price -->
          <div class="form-group">
            <label for="cost-price">Cost Price:</label>
            <input type="number" id="cost-price" name="cost-price" required>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4" required></textarea>
          </div>

          <div class="form-group">
            <label for="stock">InStock:</label>
            <input type="number" id="stock" name="stock" required>
          </div>

          <!-- Category Dropdowns -->
          <div class="category-section-1">
            <div class="form-group">
              <label for="category">By Category:</label>
              <!-- Main Category Dropdown -->
              <select id="category" name="category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="SpareByCategory">Spare By Category</option>
                <!-- <option value="automotive">Automotive</option>
                <option value="fashion">Fashion</option> -->
              </select>

              <!-- Subcategory Dropdown -->
              <select id="subcategory" name="subcategory" disabled>
                <option value="" disabled selected>Select Subcategory</option>
              </select>

              <!-- End Category Dropdown -->
              <select id="end-category" name="end-category" disabled>
                <option value="" disabled selected>Select End Category</option>
              </select>
            </div>
          </div>
          <div class="category-section-2">
            <div class="form-group">
              <label for="vehicle-category">By Vehicle:</label>
              <!-- Main Category Dropdown -->
              <select id="vehicle-category" name="vehicle-category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="SpareByVehicle">Spare By Vehicle</option>
                <!-- <option value="automotive">Automotive</option>
                <option value="fashion">Fashion</option> -->
              </select>

              <!-- Subcategory Dropdown -->
              <select id="vehicle-subcategory" name="vehicle-subcategory" disabled>
                <option value="" disabled selected>Select Subcategory</option>
              </select>

              <!-- End Category Dropdown -->
              <select id="vehicle-endcategory" name="vehicle-endcategory" disabled>
                <option value="" disabled selected>Select End Category</option>
              </select>
            </div>
          </div>
        </div>

        <div class="image-section">
          <!-- Image Upload -->
          <div class="form-group">
            <label for="product-image">Upload Product Image:</label>
            <input type="file" id="product-image" class="product-image" name="product-image" accept="image/*" required>
          </div>

          <!-- Option to Add More Images -->
          <div class="form-group" id="additional-images">
            <!-- <label for="more-images">Add More Images:</label>
            <input type="file" name="more-images[]" accept="image/*"> -->
            <button type="button" id="add-image-btn">+ Add Another Image</button>
          </div>
        </div>
      </div>
      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Add Product</button>
    </form>
  </main>

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector('.product-form'); // Select the form

      form.addEventListener('submit', (event) => {
        event.preventDefault(); // Prevent the form from submitting the traditional way


        const category = document.getElementById("category").value
        const subcategory = document.getElementById("subcategory").value
        const endCategory = document.getElementById("end-category").value
        const vehiclecategory = document.getElementById("vehicle-category").value
        const vehiclesubcategory = document.getElementById("vehicle-subcategory").value
        const vehicleendsubcategory = document.getElementById("vehicle-endcategory").value
        const sparebyCategory = {
          name: category,
          subCategoryName: subcategory,
          endCategoryName: endCategory,
        }
        const sparebyVehicle = {
          name: vehiclecategory,
          vehicleBrand: vehiclesubcategory,
          vehicleModel: vehicleendsubcategory,
        }

        // Gather input values when the form is submitted
        console.log(sparebyCategory)
        console.log(sparebyVehicle)
        const data = {
          name: document.getElementById("title").value,
          vehicle: sparebyVehicle,
          price: document.getElementById("selling-price").value,
          inventory: document.getElementById("stock").value,
          description: document.getElementById("description").value,
          category: sparebyCategory,
          brand: document.getElementById("brand").value,

        };
        console.log(data)

        const productImageElements = document.querySelectorAll(".product-image"); // Get all file input elements
        const productImage = [];

        productImageElements.forEach(input => {
          if (input.files.length > 0) {
            console.log("This is input", input);
            console.log("This is input file", input.files);

            Array.from(input.files).forEach(file => productImage.push(file));
            // productImageElements.innerHTML = `<img src="${`http://${IP}:${PORT}/api/v1/images/image/download/${files[0]}`}"></img>`
          }
        });


        console.log(productImage);

        if (!productImage) {
          console.error("No product image selected");
          alert("Please select a product image before submitting.");
          return;
        }

        const url = `http://${IP}:${PORT}/api/v1/products/add`; // Backend URL for adding product

        // Step 1: Add the product
        fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then(response => {
            if (!response.ok) {
              return response.json().then(err => {
                console.error("Product creation failed:", err);
                throw new Error("Failed to create product: " + response.statusText);
              });
            }
            return response.json(); // Parse JSON response
          })
          .then(productData => {
            console.log("Product added successfully:", productData);
            console.log("product image ", productImage);
            console.log("Product Id", productData.data.id)

            // Step 2: Upload the image
            const formData = new FormData();
            productImage.forEach((files) => {
              formData.append(`files`, files); // Append each file with a unique key
            }); // Append the image file
            // formData.append("productId", productData.data.id); // Append the product ID
            const urlimage = `http://${IP}:${PORT}/api/v1/images/upload?productId=${productData.data.id}`;

            return fetch(urlimage, {
              method: "POST",
              body: formData,
            });
          })
          .then(imageResponse => {
            if (!imageResponse.ok) {
              throw new Error("Image upload failed: " + imageResponse.statusText);
            }
            return imageResponse.json();
          })
          .then(imageData => {
            console.log("Image uploaded successfully:", imageData);
            alert("Product and image added successfully!");
          })
          .catch(error => {
            console.error("Error:", error.message);
            alert("An error occurred: " + error.message);
          });
      });
